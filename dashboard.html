<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Codverse Tech</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: var(--light);
            margin: 0;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--dark);
            color: white;
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-logo img {
            height: 40px;
            min-width: 40px;
            margin-right: 1rem;
        }

        .sidebar.collapsed .sidebar-logo span {
            display: none;
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
        }

        .nav-item {
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item-icon {
            min-width: 24px;
            margin-right: 1rem;
            text-align: center;
        }

        .sidebar.collapsed .nav-item span {
            display: none;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .dashboard-header {
            height: 70px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .header-logo {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
            }
            .sidebar.mobile-open {
                left: 0;
            }
            .header-logo {
                display: block;
            }
            .header-logo img {
                height: 32px;
            }
        }

        .collapse-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.5rem;
        }

        .content-body {
            padding: 2.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="assets/logo.jpg" alt="Codverse Tech Logo">
                <span>Codverse <strong>Tech</strong></span>
            </div>
            <button class="collapse-btn" id="toggle-sidebar">&#9776;</button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active">
                <div class="nav-item-icon">&#128200;</div>
                <span>Overview</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">&#128187;</div>
                <span>Projects</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">&#9881;</div>
                <span>Settings</span>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="header-logo">
                <img src="assets/logo.jpg" alt="Codverse Tech Logo">
            </div>
            <div class="header-search">
                <h3 style="margin: 0;">Project Dashboard</h3>
            </div>
            <div class="header-profile">
                <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%;"></div>
            </div>
        </header>

        <div class="content-body">
            <h1 style="margin-bottom: 2rem;">Welcome, User</h1>
            <div class="card-grid">
                <div class="stat-card">
                    <h3 style="color: var(--text-muted);">Active Projects</h3>
                    <p style="font-size: 2.5rem; font-weight: 700;">12</p>
                </div>
                <div class="stat-card">
                    <h3 style="color: var(--text-muted);">Tasks Pending</h3>
                    <p style="font-size: 2.5rem; font-weight: 700;">4</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
